<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>IARA no celular (simulação)</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2a302d; font-family: Arial, sans-serif; color: #e6eee8; }
  .aparelho { width: 412px; height: 860px; padding: 14px; background: #0b0d0c; border-radius: 44px; box-shadow: 0 0 0 2px #3a403d; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 32px; background: #eef3ee; display: block; }
  .barra { display: flex; gap: 10px; justify-content: center; margin-top: 14px; font-size: 14px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #56605a; background: #1b211e; color: inherit; cursor: pointer; }
  @media (max-height: 920px) { .aparelho { transform: scale(0.85); transform-origin: top center; margin-bottom: -120px; } }
</style>
</head>
<body>
<div>
  <div class="aparelho"><iframe id="app" src="www/index.html" title="App IARA"></iframe></div>
  <div class="barra">
    <button type="button" onclick="document.getElementById('app').src='www/index.html'">Voltar ao início</button>
    <button type="button" onclick="document.getElementById('app').contentWindow.location.reload()">Recarregar</button>
  </div>
</div>
</body>
</html>
